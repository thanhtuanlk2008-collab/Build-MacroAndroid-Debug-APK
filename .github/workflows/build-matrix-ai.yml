name: Build Soul Knight Matrix AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - feature/soul-knight-matrix-ai
    paths:
      - "SoulKnightMatrixAI/**"
      - ".github/workflows/build-matrix-ai.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Build debug APK
        working-directory: SoulKnightMatrixAI
        run: gradle assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: SoulKnightMatrixAI-debug-apk
          path: SoulKnightMatrixAI/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
